services:
  app:
    build: .
    container_name: app_hello_world
    restart: always
    networks:
      - app_net

  nginx:
    image: nginx:latest
    container_name: nginx_reverse_proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - app_net
    depends_on:
      - app

networks:
  app_net:
    driver: bridge
